<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المعمل الافتراضي — منصة MADAR</title>
  
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="css/lab.css">

  <!-- خريطة استيراد مكتبات الـ 3D -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div class="bg-orbs"></div>

  <nav class="lab-navbar">
    <div class="logo">MADAR Lab 🔬</div>
    <a href="dashboard.html" class="btn-back">← رجوع للرئيسية</a>
  </nav>

  <div class="loading-screen" id="loading-screen">
    <div class="spinner"></div>
    <h2>جاري تحميل المجسم ثلاثي الأبعاد...</h2>
    <p>قد يستغرق بضع ثوانٍ حسب سرعة الإنترنت</p>
  </div>

  <div id="canvas-container"></div>

  <div class="info-panel glass-panel" id="info-panel">
    <h3 id="lab-title">جاري التحميل...</h3>
    <p id="lab-desc">جاري تحميل الوصف...</p>
    <ul id="lab-features">
      <!-- المميزات هتظهر هنا بالجافاسكريبت -->
    </ul>
    <button id="toggle-rotation" class="btn-toggle">إيقاف الدوران التلقائي</button>
  </div>

  <script type="module" src="js/lab.js"></script>
</body>
</html>
