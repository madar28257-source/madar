<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الكتب — لوحة تحكم مدار</title>
  
  <!-- بنرجع خطوة للخلف عشان نلاقي ملفات الـ css -->
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <div class="bg-orbs"></div>

  <!-- القائمة الجانبية -->
  <aside class="sidebar">
    <div class="logo">MADAR</div>
    <nav class="nav-links">
      <a href="admin.html">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>لوحة التحكم</span>
      </a>
      <a href="admin-exams.html">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        <span>الامتحانات</span>
      </a>
      <a href="admin-books.html" class="active">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        <span>المكتبة والملازم</span>
      </a>
    </nav>
  </aside>

  <!-- المحتوى الرئيسي -->
  <main class="main-content">
    <div class="top-bar">
      <h2>إضافة كتاب جديد للمكتبة</h2>
      <div class="admin-info">
        <span style="font-weight:600; font-size:0.9rem;" id="admin-name">جاري التحميل...</span>
        <div class="admin-avatar">A</div>
      </div>
    </div>

    <div class="form-panel glass-panel">
      <h3 style="margin-bottom: 20px; color: #fff;">بيانات الكتاب أو الملزمة</h3>
      <div class="form-grid">
        
        <div class="input-group">
          <label>المادة الدراسية</label>
          <select id="book-subject">
            <option value="الرياضيات">الرياضيات</option>
            <option value="اللغة العربية">اللغة العربية</option>
            <option value="التاريخ">التاريخ</option>
            <option value="اللغة الإنجليزية">اللغة الإنجليزية</option>
            <option value="إنجليزي مستوى">إنجليزي مستوى</option>
            <option value="العلوم المتكاملة">العلوم المتكاملة</option>
            <option value="الفلسفة">الفلسفة</option>
          </select>
        </div>

        <div class="input-group">
          <label>عنوان الكتاب / الملزمة</label>
          <input type="text" id="book-title" placeholder="مثال: ملزمة الرياضيات - الفصل الأول">
        </div>
        
        <div class="input-group">
          <label>وصف قصير (اختياري)</label>
          <input type="text" id="book-desc" placeholder="شرح مبسط للمحتوى">
        </div>

        <!-- أهم خانة: رابط الملف -->
        <div class="input-group" style="grid-column: 1 / -1;">
          <label style="color: #22c55e;">رابط تحميل الملف (PDF Link) <span style="color:#ef4444; font-size:0.8rem;">* مطلوب</span></label>
          <input type="url" id="book-url" placeholder="الصق هنا رابط الملف من Google Drive أو أي موقع رفع">
          <small style="color: var(--text-muted); margin-top: 5px; display: block;">تأكد إن صلاحية الرابط (Anyone with the link).</small>
        </div>

      </div>

      <button class="btn-save" id="save-book-btn" style="margin-top: 30px;">حفظ الكتاب في قاعدة البيانات</button>
    </div>
  </main>

  <script type="module" src="../js/admin-books.js"></script>
</body>
</html>
