<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الكتب — لوحة تحكم مدار</title>
  
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="../css/admin.css?v=7">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class="bg-orbs"></div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <aside class="sidebar" id="sidebar">
    <button class="close-sidebar-btn" id="close-sidebar-btn">✖</button>
    <div class="logo">MADAR</div>
    <nav class="nav-links">
      <a href="admin.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span>لوحة التحكم</span></a>
      <a href="admin-exams.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg><span>الامتحانات</span></a>
      <a href="admin-evaluations.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"></path></svg><span>التقييمات</span></a>
      <a href="admin-books.html" class="active"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path></svg><span>المكتبة</span></a>
      <a href="admin-students.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg><span>الطلاب</span></a>
      <a href="admins.html" id="admins-tab" style="display: none;"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg><span>إدارة الأدمن</span></a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="top-bar">
      <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
      <h2>إضافة كتاب جديد للمكتبة</h2>
      <div class="admin-info">
        <span style="font-weight:600; font-size:0.9rem;" id="admin-name">جاري التحميل...</span>
        <div class="admin-avatar">A</div>
      </div>
    </div>

    <!-- فورم إضافة الكتاب -->
    <div class="form-panel glass-panel">
      <h3 style="margin-bottom: 20px; color: #fff;">بيانات الكتاب أو الملزمة</h3>
      <div class="form-grid">
        
        <div class="input-group">
          <label>السنة الدراسية</label>
          <select id="book-grade">
            <option value="" disabled selected>اختر السنة...</option>
            <option value="1-prep">الأول الإعدادي</option>
            <option value="2-prep">الثاني الإعدادي</option>
            <option value="3-prep">الثالث الإعدادي</option>
            <option value="1-sec">الأول الثانوي</option>
            <option value="2-sec">الثاني الثانوي</option>
          </select>
        </div>

        <div class="input-group">
          <label>المادة الدراسية</label>
          <select id="book-subject">
            <option value="الرياضيات">الرياضيات</option>
            <option value="اللغة العربية">اللغة العربية</option>
            <option value="التاريخ">التاريخ</option>
            <option value="اللغة الإنجليزية">اللغة الإنجليزية</option>
            <option value="إنجليزي مستوى">إنجليزي مستوى</option>
            <option value="العلوم المتكاملة">العلوم المتكاملة</option>
            <option value="الفلسفة">الفلسفة</option>
          </select>
        </div>

        <div class="input-group">
          <label>عنوان الكتاب / الملزمة</label>
          <input type="text" id="book-title" placeholder="مثال: ملزمة الرياضيات - الفصل الأول">
        </div>
        
        <div class="input-group">
          <label>وصف قصير (اختياري)</label>
          <input type="text" id="book-desc" placeholder="شرح مبسط للمحتوى">
        </div>

        <div class="input-group" style="grid-column: 1 / -1;">
          <label style="color: #22c55e;">رابط تحميل الملف (PDF Link) *</label>
          <input type="url" id="book-url" placeholder="الصق هنا رابط الملف من Google Drive">
        </div>

      </div>
      <button class="btn-save" id="save-book-btn" style="margin-top: 20px;">حفظ الكتاب في قاعدة البيانات</button>
    </div>

    <!-- جدول عرض الكتب -->
    <div class="table-container glass-panel" style="margin-top: 30px;">
      <h3 style="margin-bottom: 20px; color: #fff;">الكتب المضافة حالياً</h3>
      <table>
        <thead>
          <tr>
            <th>العنوان</th>
            <th>المادة</th>
            <th>السنة</th>
            <th>الإجراءات</th>
          </tr>
        </thead>
        <tbody id="books-table-body">
          <tr><td colspan="4" style="text-align:center;">جاري التحميل...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    const sidebar = document.getElementById('sidebar'); const overlay = document.getElementById('sidebar-overlay');
    const menuBtn = document.getElementById('mobile-menu-btn'); const closeBtn = document.getElementById('close-sidebar-btn');
    function toggleMenu() { sidebar.classList.toggle('open'); overlay.classList.toggle('active'); }
    if(menuBtn) menuBtn.addEventListener('click', toggleMenu); if(closeBtn) closeBtn.addEventListener('click', toggleMenu); if(overlay) overlay.addEventListener('click', toggleMenu);
  </script>
  <script type="module" src="../js/admin-books.js?v=7"></script>
</body>
</html>
