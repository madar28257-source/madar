<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم الأدمن — منصة MADAR</title>
  
  <link rel="stylesheet" href="../base.css">
  <!-- ضفنا رقم عشان الكاش -->
  <link rel="stylesheet" href="../css/admin.css?v=11">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    /* 🔥 ستايل علامة اللايف */
    .live-badge {
        display: inline-flex; align-items: center; gap: 8px;
        background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444;
        color: #ef4444; padding: 4px 12px; border-radius: 20px;
        font-size: 0.8rem; font-weight: 900; margin-right: 15px;
        text-transform: uppercase; vertical-align: middle;
    }
    .live-dot {
        width: 10px; height: 10px; background: #ef4444;
        border-radius: 50%; animation: blink 1s infinite;
    }
    @keyframes blink {
        0%, 100% { opacity: 1; box-shadow: 0 0 10px #ef4444; }
        50% { opacity: 0.3; box-shadow: 0 0 0 #ef4444; }
    }
  </style>
</head>
<body>

  <div class="bg-orbs"></div>

  <!-- الطبقة السوداء الشفافة -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- القائمة الجانبية -->
  <aside class="sidebar" id="sidebar">
    <button class="close-sidebar-btn" id="close-sidebar-btn">✖</button>
    <div class="logo">MADAR</div>
    <nav class="nav-links">
      <a href="admin.html" class="active">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>لوحة التحكم</span>
      </a>
      <a href="admin-exams.html">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        <span>الامتحانات</span>
      </a>
      <a href="admin-evaluations.html">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
        <span>التقييمات</span>
      </a>
      <a href="admin-books.html">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        <span>المكتبة</span>
      </a>
      <a href="admin-students.html">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span>الطلاب</span>
      </a>
      
      <!-- 🔥 زرار الفرق الجديد -->
      <a href="admin-teams.html">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span>الفرق</span>
      </a>

      <a href="admins.html" id="admins-tab" style="display: none;">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        <span>إدارة الأدمن</span>
      </a>
    </nav>
  </aside>

  <!-- المحتوى الرئيسي -->
  <main class="main-content">
    
    <div class="top-bar">
      <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
      <h2>
        لوحة تحكم المعلم 
        <span class="live-badge"><span class="live-dot"></span> LIVE</span>
      </h2>
      <div class="admin-info">
        <span style="font-weight:600; font-size:0.9rem;" id="admin-name">جاري التحميل...</span>
        <div class="admin-avatar">A</div>
        <button class="btn-logout" id="logout-btn">خروج</button>
      </div>
    </div>

    <!-- الإحصائيات -->
    <div class="stats-grid">
      <div class="stat-card glass-panel">
        <div class="stat-icon purple"><svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg></div>
        <div class="stat-info"><h4>إجمالي الطلاب</h4><p id="stat-students">0</p></div>
      </div>
      
      <div class="stat-card glass-panel">
        <div class="stat-icon cyan"><svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg></div>
        <div class="stat-info"><h4>الامتحانات المنشأة</h4><p id="stat-exams">0</p></div>
      </div>

      <div class="stat-card glass-panel">
        <div class="stat-icon green"><svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg></div>
        <div class="stat-info"><h4>التقييمات</h4><p id="stat-evals">0</p></div>
      </div>
    </div>

    <!-- جدول النتائج اللايف -->
    <div class="table-container glass-panel">
      <h3 style="margin-bottom: 20px; color: #fff;">أحدث نتائج الطلاب</h3>
      
      <table>
        <thead>
          <tr>
            <th>اسم الطالب</th>
            <th>السنة الدراسية</th>
            <th>المادة</th>
            <th>الاختبار</th>
            <th>الدرجة</th>
            <th>التاريخ</th>
            <th>الإجراءات</th>
          </tr>
        </thead>
        <tbody id="results-table-body">
          <tr><td colspan="7" style="text-align:center; color: var(--text-muted);">جاري تحميل البيانات...</td></tr>
        </tbody>
      </table>
    </div>

  </main>

  <script>
    // كود فتح وقفل القائمة في الموبايل
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    const menuBtn = document.getElementById('mobile-menu-btn');
    const closeBtn = document.getElementById('close-sidebar-btn');
    
    function toggleMenu() { 
        sidebar.classList.toggle('open'); 
        overlay.classList.toggle('active'); 
    }
    
    if(menuBtn) menuBtn.addEventListener('click', toggleMenu);
    if(closeBtn) closeBtn.addEventListener('click', toggleMenu);
    if(overlay) overlay.addEventListener('click', toggleMenu);
  </script>

  <!-- ربط ملف الجافاسكريبت الخاص بالداشبورد -->
  <script type="module" src="../js/admin-dashboard.js?v=10"></script>
</body>
</html>
