<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم الأدمن — منصة MADAR</title>
  
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <div class="bg-orbs"></div>

  <aside class="sidebar">
    <div class="logo">MADAR</div>
    <nav class="nav-links">
      <a href="admin.html" class="active">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>لوحة التحكم</span>
      </a>
      <a href="admin-exams.html">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg>
        <span>الامتحانات</span>
      </a>
      <a href="admin-evaluations.html">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"></path></svg>
        <span>التقييمات</span>
      </a>
      <a href="admin-books.html">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path></svg>
        <span>المكتبة</span>
      </a>
      <a href="admin-students.html">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
        <span>الطلاب</span>
      </a>
      <a href="admins.html" id="admins-tab" style="display: flex;">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        <span>إدارة الأدمن</span>
      </a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="top-bar">
      <h2>لوحة تحكم المعلم</h2>
      <div class="admin-info">
        <span style="font-weight:600; font-size:0.9rem;" id="admin-name">جاري التحميل...</span>
        <div class="admin-avatar">A</div>
        <button class="btn-logout" id="logout-btn">خروج</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card glass-panel">
        <div class="stat-icon purple"><svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg></div>
        <div class="stat-info"><h4>إجمالي الطلاب</h4><p id="stat-students">0</p></div>
      </div>
      
      <div class="stat-card glass-panel">
        <div class="stat-icon cyan"><svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg></div>
        <div class="stat-info"><h4>الامتحانات المنشأة</h4><p id="stat-exams">0</p></div>
      </div>

      <div class="stat-card glass-panel">
        <div class="stat-icon green"><svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg></div>
        <div class="stat-info"><h4>التقييمات</h4><p id="stat-evals">0</p></div>
      </div>
    </div>

    <div class="table-container glass-panel">
      <h3 style="margin-bottom: 20px; color: #fff;">أحدث نتائج الطلاب</h3>
      
      <table>
        <thead>
          <tr>
            <th>اسم الطالب</th>
            <th>السنة الدراسية</th>
            <th>المادة</th>
            <th>الاختبار</th>
            <th>الدرجة</th>
            <th>التاريخ</th>
            <th>الإجراءات</th>
          </tr>
        </thead>
        <tbody id="results-table-body">
          <tr><td colspan="7" style="text-align:center; color: var(--text-muted);">جاري تحميل البيانات...</td></tr>
        </tbody>
      </table>
    </div>

  </main>

  <script type="module">
    import { auth } from "../firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

    onAuthStateChanged(auth, (user) => {
      // 🔥 حل الطوارئ: إنت بس اللي هتقدر تدخل لوحة التحكم
      if (user && user.email.trim().toLowerCase() === "mohamed7@gmail.com") {
        document.getElementById("admin-name").textContent = user.displayName || "الأدمن";
        // الكود ده موجود في js/admin-dashboard.js بس عشان نضمن إنه شغال
        if (typeof loadDashboardData === 'function') {
            loadDashboardData();
        }
      } else if (user) {
        // لو حد تاني حاول يدخل، نطرده
        window.location.href = "../dashboard.html"; 
      } else {
        window.location.href = "../index.html";
      }
    });

    document.getElementById("logout-btn").addEventListener("click", () => {
      Swal.fire({
        title: 'تسجيل الخروج', text: "هل أنت متأكد من الخروج؟", icon: 'warning',
        showCancelButton: true, confirmButtonColor: '#ef4444', cancelButtonColor: '#2a2a3e',
        confirmButtonText: 'نعم، خروج', cancelButtonText: 'إلغاء', background: '#12121f', color: '#fff'
      }).then((result) => {
        if (result.isConfirmed) { signOut(auth).then(() => window.location.href = "../index.html"); }
      });
    });
  </script>

  <script type="module" src="../js/admin-dashboard.js"></script>
</body>
</html>
