<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الامتحانات — لوحة تحكم مدار</title>
  
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="../css/admin.css?v=5">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .hidden-field { display: none; }
    
    /* تنسيق كروت الامتحانات */
    .exams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .exam-manage-card { background: var(--surface-color); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 20px; position: relative; transition: 0.3s; }
    .exam-manage-card:hover { border-color: var(--primary); box-shadow: 0 5px 20px rgba(124, 58, 237, 0.15); transform: translateY(-3px); }
    
    .exam-manage-card h3 { color: #fff; font-size: 1.2rem; margin-bottom: 10px; }
    .exam-manage-card .meta { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .exam-manage-card .badge { background: rgba(34, 211, 238, 0.1); color: var(--accent); padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; }
    .exam-manage-card .badge.students { background: rgba(34, 197, 94, 0.1); color: #22c55e; }
    
    .card-actions { display: flex; gap: 10px; margin-top: 15px; border-top: 1px solid var(--glass-border); padding-top: 15px; }
    .card-actions button { flex: 1; padding: 8px; border-radius: var(--radius-sm); font-family: inherit; font-weight: 700; cursor: pointer; border: none; transition: 0.3s; }
    .btn-manage { background: rgba(124, 58, 237, 0.15); color: var(--primary-light); border: 1px solid rgba(124, 58, 237, 0.3); }
    .btn-manage:hover { background: var(--primary); color: #fff; }
    .btn-delete-exam { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn-delete-exam:hover { background: #ef4444; color: #fff; }
    
    /* تنسيق جدول الترتيب داخل SweetAlert */
    .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: right; }
    .leaderboard-table th { background: rgba(255,255,255,0.05); padding: 10px; color: var(--text-muted); font-size: 0.85rem; }
    .leaderboard-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #fff; font-size: 0.9rem; }
    .leaderboard-table .rank { font-weight: bold; color: var(--accent); }
    .leaderboard-table .score { font-weight: bold; color: #22c55e; }
    .leaderboard-table .time { color: var(--text-muted); font-size: 0.8rem; }
  </style>
</head>
<body>

  <div class="bg-orbs"></div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <aside class="sidebar" id="sidebar">
    <button class="close-sidebar-btn" id="close-sidebar-btn">✖</button>
    <div class="logo">MADAR</div>
    <nav class="nav-links">
      <a href="admin.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span>لوحة التحكم</span></a>
      <a href="admin-exams.html" class="active"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg><span>الامتحانات</span></a>
      <a href="admin-evaluations.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"></path></svg><span>التقييمات</span></a>
      <a href="admin-books.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path></svg><span>المكتبة</span></a>
      <a href="admin-students.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg><span>الطلاب</span></a>
      <a href="admins.html" id="admins-tab" style="display: none;"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg><span>إدارة الأدمن</span></a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="top-bar">
      <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
      <h2>إدارة الامتحانات</h2>
      <div class="admin-info">
        <span style="font-weight:600; font-size:0.9rem;" id="admin-name">جاري التحميل...</span>
        <div class="admin-avatar">A</div>
      </div>
    </div>

    <!-- التابات -->
    <div class="filter-tabs">
      <button class="tab-btn active" data-grade="all">كل الامتحانات</button>
      <button class="tab-btn" data-grade="1-prep">أولى إعدادي</button>
      <button class="tab-btn" data-grade="2-prep">تانية إعدادي</button>
      <button class="tab-btn" data-grade="3-prep">تالتة إعدادي</button>
      <button class="tab-btn" data-grade="1-sec">أولى ثانوي</button>
      <button class="tab-btn" data-grade="2-sec">تانية ثانوي</button>
    </div>

    <!-- شبكة الامتحانات -->
    <div class="exams-grid" id="exams-container">
      <div style="text-align:center; grid-column:1/-1; padding:20px; color:var(--text-muted);">جاري تحميل الامتحانات...</div>
    </div>

    <hr style="border: 0; border-top: 1px solid var(--glass-border); margin: 40px 0;">

    <!-- فورم إضافة امتحان جديد (في الأسفل) -->
    <div class="form-panel glass-panel">
      <h3 style="margin-bottom: 20px; color: #fff;">إنشاء امتحان جديد</h3>
      <div class="form-grid">
        <div class="input-group">
          <label>السنة الدراسية</label>
          <select id="exam-grade">
            <option value="" disabled selected>اختر السنة...</option>
            <option value="1-prep">الأول الإعدادي</option>
            <option value="2-prep">الثاني الإعدادي</option>
            <option value="3-prep">الثالث الإعدادي</option>
            <option value="1-sec">الأول الثانوي</option>
            <option value="2-sec">الثاني الثانوي</option>
          </select>
        </div>
        <div class="input-group hidden-field" id="system-group">
          <label>النظام</label>
          <select id="exam-system">
            <option value="general">عام</option>
            <option value="baccalaureate">بكالوريا</option>
          </select>
        </div>
        <div class="input-group hidden-field" id="track-group">
          <label>المسار</label>
          <select id="exam-track">
            <option value="medicine">الطب</option>
            <option value="engineering">الهندسة</option>
            <option value="business">الأعمال</option>
            <option value="arts">الآداب</option>
          </select>
        </div>
        <div class="input-group">
          <label>المادة الدراسية</label>
          <input type="text" id="exam-subject" placeholder="مثال: الرياضيات...">
        </div>
        <div class="input-group">
          <label>عنوان الامتحان</label>
          <input type="text" id="exam-title" placeholder="مثال: اختبار الفصل الأول">
        </div>
        <div class="input-group">
          <label>المدة (بالدقائق)</label>
          <input type="number" id="exam-duration" value="30" min="1">
        </div>
      </div>
    </div>

    <div class="form-panel glass-panel">
      <h3 style="margin-bottom: 20px; color: #fff;">أسئلة الامتحان</h3>
      <div id="questions-container"></div>
      <button class="btn-save" style="background: rgba(124, 58, 237, 0.1); color: var(--primary-light); border: 1px dashed var(--primary); margin-bottom: 20px;" id="add-question-btn">+ إضافة سؤال جديد</button>
      <button class="btn-save" id="save-exam-btn">حفظ الامتحان في قاعدة البيانات</button>
    </div>

  </main>

  <script>
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    const menuBtn = document.getElementById('mobile-menu-btn');
    const closeBtn = document.getElementById('close-sidebar-btn');
    function toggleMenu() { sidebar.classList.toggle('open'); overlay.classList.toggle('active'); }
    if(menuBtn) menuBtn.addEventListener('click', toggleMenu);
    if(closeBtn) closeBtn.addEventListener('click', toggleMenu);
    if(overlay) overlay.addEventListener('click', toggleMenu);
  </script>

  <script type="module" src="../js/admin-exams.js?v=5"></script>
</body>
</html>
