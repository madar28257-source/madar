<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إضافة امتحان — لوحة تحكم مدار</title>
  
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="../css/admin.css?v=4">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .hidden-field { display: none; }
  </style>
</head>
<body>

  <div class="bg-orbs"></div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <aside class="sidebar" id="sidebar">
    <button class="close-sidebar-btn" id="close-sidebar-btn">✖</button>
    <div class="logo">MADAR</div>
    <nav class="nav-links">
      <a href="admin.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span>لوحة التحكم</span></a>
      <a href="admin-exams.html" class="active"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg><span>الامتحانات</span></a>
      <a href="admin-evaluations.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"></path></svg><span>التقييمات</span></a>
      <a href="admin-books.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path></svg><span>المكتبة</span></a>
      <a href="admin-students.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg><span>الطلاب</span></a>
      <a href="admins.html" id="admins-tab" style="display: none;"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg><span>إدارة الأدمن</span></a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="top-bar">
      <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
      <h2>إنشاء امتحان جديد</h2>
      <div class="admin-info">
        <span style="font-weight:600; font-size:0.9rem;" id="admin-name">جاري التحميل...</span>
        <div class="admin-avatar">A</div>
      </div>
    </div>

    <!-- فورم إضافة الامتحان -->
    <div class="form-panel glass-panel">
      <h3 style="margin-bottom: 20px; color: #fff;">بيانات الامتحان</h3>
      <div class="form-grid">
        
        <div class="input-group">
          <label>السنة الدراسية</label>
          <select id="exam-grade">
            <option value="" disabled selected>اختر السنة...</option>
            <option value="1-prep">الأول الإعدادي</option>
            <option value="2-prep">الثاني الإعدادي</option>
            <option value="3-prep">الثالث الإعدادي</option>
            <option value="1-sec">الأول الثانوي</option>
            <option value="2-sec">الثاني الثانوي</option>
          </select>
        </div>

        <div class="input-group hidden-field" id="system-group">
          <label>النظام</label>
          <select id="exam-system">
            <option value="general">عام</option>
            <option value="baccalaureate">بكالوريا</option>
          </select>
        </div>

        <div class="input-group hidden-field" id="track-group">
          <label>المسار</label>
          <select id="exam-track">
            <option value="medicine">الطب</option>
            <option value="engineering">الهندسة</option>
            <option value="business">الأعمال</option>
            <option value="arts">الآداب</option>
          </select>
        </div>

        <div class="input-group">
          <label>المادة الدراسية</label>
          <input type="text" id="exam-subject" placeholder="مثال: الرياضيات...">
        </div>

        <div class="input-group">
          <label>عنوان الامتحان</label>
          <input type="text" id="exam-title" placeholder="مثال: اختبار الفصل الأول">
        </div>
        <div class="input-group">
          <label>المدة (بالدقائق)</label>
          <input type="number" id="exam-duration" value="30" min="1">
        </div>
      </div>
    </div>

    <!-- فورم إضافة الأسئلة -->
    <div class="form-panel glass-panel">
      <h3 style="margin-bottom: 20px; color: #fff;">أسئلة الامتحان</h3>
      <div id="questions-container"></div>
      <button class="btn-save" style="background: rgba(124, 58, 237, 0.1); color: var(--primary-light); border: 1px dashed var(--primary); margin-bottom: 20px;" id="add-question-btn">+ إضافة سؤال جديد</button>
      
      <button class="btn-save" id="save-exam-btn">حفظ الامتحان في قاعدة البيانات</button>
    </div>

    <!-- 🔥 جدول مسح الامتحانات -->
    <div class="table-container glass-panel">
      <h3 style="margin-bottom: 20px; color: #fff;">الامتحانات المضافة حالياً</h3>
      <table>
        <thead>
          <tr>
            <th>العنوان</th>
            <th>المادة</th>
            <th>السنة</th>
            <th>الإجراءات</th>
          </tr>
        </thead>
        <tbody id="exams-table-body">
          <tr><td colspan="4" style="text-align:center;">جاري التحميل...</td></tr>
        </tbody>
      </table>
    </div>

  </main>

  <script>
    // كود فتح وقفل القائمة
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    const menuBtn = document.getElementById('mobile-menu-btn');
    const closeBtn = document.getElementById('close-sidebar-btn');
    function toggleMenu() { sidebar.classList.toggle('open'); overlay.classList.toggle('active'); }
    if(menuBtn) menuBtn.addEventListener('click', toggleMenu);
    if(closeBtn) closeBtn.addEventListener('click', toggleMenu);
    if(overlay) overlay.addEventListener('click', toggleMenu);
  </script>

  <script type="module" src="../js/admin-exams.js"></script>
</body>
</html>
