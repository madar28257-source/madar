      <a href="admin-books.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path></svg><span>المكتبة</span></a>

  <main class="main-content">
    <div class="top-bar">
      <h2>قائمة الطلاب المسجلين</h2>

        <div class="admin-avatar">A</div>
      </div>
    </div>

    <div class="filter-tabs">
      <button class="tab-btn active" data-grade="all">كل الطلاب</button>
      <button class="tab-btn" data-grade="1-prep">أولى إعدادي</button>
      <button class="tab-btn" data-grade="2-prep">تانية إعدادي</button>

        <thead>
          <tr>
            <th>#</th>
            <th>اسم الطالب</th>
            <th>رقم الهاتف</th>
            <th>البريد الإلكتروني</th>
            <th>السنة الدراسية</th>
            <th>تاريخ التسجيل</th>
            <th>الإجراءات</th>
          </tr>
        </thead>
        <tbody id="students-table-body">
          <tr><td colspan="7" style="text-align:center; color: var(--text-muted);">جاري تحميل البيانات...</td></tr>
        </tbody>
      </table>
