<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فريق المذاكرة — منصة MADAR</title>
  
  <link rel="stylesheet" href="base.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body { background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px;}
    .team-container { width: 100%; max-width: 600px; padding: 40px; text-align: center; position: relative; z-index: 10;}
    
    .header-sec { margin-bottom: 30px; }
    .header-sec h1 { font-size: 2rem; color: #fff; margin-bottom: 10px; }
    .header-sec p { color: var(--text-muted); font-size: 1rem; }
    
    .action-btns { display: flex; gap: 15px; justify-content: center; margin-bottom: 30px; }
    .action-btns button { flex: 1; padding: 15px; font-size: 1.1rem; }
    
    .form-box { display: none; background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); padding: 20px; border-radius: var(--radius-sm); margin-bottom: 20px; }
    .form-box.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from{opacity:0; transform: translateY(-10px);} to{opacity:1; transform: translateY(0);} }
    
    .input-group { text-align: right; margin-bottom: 15px; }
    .input-group label { display: block; color: var(--text-muted); margin-bottom: 5px; font-size: 0.9rem; }
    .input-group input { width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 8px; color: #fff; outline: none; font-family: inherit; font-size: 1rem; }
    .input-group input:focus { border-color: var(--primary); }
    
    .btn-submit { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: inherit; font-size: 1rem; }

    /* تصميم لوحة الفريق */
    .team-dashboard { display: none; }
    .team-dashboard.active { display: block; animation: fadeIn 0.5s ease; }
    
    .team-name-display { font-size: 2.5rem; font-weight: 900; color: var(--accent); text-shadow: 0 0 20px rgba(34,211,238,0.4); margin-bottom: 20px; }
    .invite-code-box { background: rgba(245, 158, 11, 0.1); border: 2px dashed #f59e0b; padding: 15px; border-radius: 12px; margin-bottom: 20px; cursor: pointer; transition: 0.3s;}
    .invite-code-box:hover { background: rgba(245, 158, 11, 0.2); }
    .invite-code-box h3 { color: #f59e0b; font-size: 1rem; margin-bottom: 5px; }
    .invite-code { font-size: 2rem; font-weight: 900; color: #fff; letter-spacing: 2px; }
    
    .team-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
    .stat-box { background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); padding: 15px; border-radius: 12px; }
    .stat-box h4 { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 5px; }
    .stat-box p { color: #fff; font-size: 1.5rem; font-weight: 900; }

    .btn-back { display: inline-block; margin-top: 20px; color: var(--text-muted); text-decoration: none; font-weight: bold; border: 1px solid var(--glass-border); padding: 10px 20px; border-radius: 8px; transition: 0.3s;}
    .btn-back:hover { color: #fff; background: rgba(255,255,255,0.05); }
  </style>
</head>
<body>

  <div class="bg-orbs"></div>

  <main class="team-container glass-panel">
    
    <!-- الجزء اللي بيظهر لو مفيش فريق -->
    <div id="no-team-view">
        <div class="header-sec">
          <h1>🤝 فريق المذاكرة</h1>
          <p>ذاكروا مع بعض، اجمعوا نقاط، واطلعوا الأول على المنصة!</p>
        </div>
        
        <div class="action-btns">
            <button class="btn-submit" onclick="showForm('create')" style="background: linear-gradient(135deg, #7c3aed, #22d3ee);">إنشاء فريق جديد</button>
            <button class="btn-submit" onclick="showForm('join')" style="background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);">الانضمام بكود</button>
        </div>

        <div id="create-form" class="form-box">
            <div class="input-group">
                <label>اسم الفريق (مثال: أبطال الفيزياء)</label>
                <input type="text" id="team-name-input" placeholder="اكتب اسم الفريق هنا...">
            </div>
            <button class="btn-submit" onclick="createTeam()">تأكيد الإنشاء</button>
        </div>

        <div id="join-form" class="form-box">
            <div class="input-group">
                <label>كود الدعوة (مثال: #MADAR-1234)</label>
                <input type="text" id="join-code-input" placeholder="الصق كود الدعوة هنا..." style="direction: ltr; text-align: center;">
            </div>
            <button class="btn-submit" onclick="joinTeam()">انضمام</button>
        </div>
    </div>

    <!-- الجزء اللي بيظهر لو الطالب في فريق -->
    <div id="team-dashboard-view" class="team-dashboard">
        <div class="header-sec">
            <h1>مرحباً بك في فريقك!</h1>
        </div>
        
        <div class="team-name-display" id="display-team-name">اسم الفريق</div>
        
        <div class="invite-code-box" onclick="copyCode()">
            <h3>اضغط لنسخ كود الدعوة وابعته لصحابك</h3>
            <div class="invite-code" id="display-invite-code">#MADAR-0000</div>
        </div>
        
        <div class="team-stats">
            <div class="stat-box">
                <h4>نقاط الفريق (XP)</h4>
                <p id="display-team-xp">0</p>
            </div>
            <div class="stat-box">
                <h4>عدد الأعضاء</h4>
                <p id="display-team-members">1</p>
            </div>
        </div>

        <a href="dashboard.html" class="btn-back">← العودة للرئيسية</a>
    </div>

  </main>

  <script type="module" src="js/teams.js"></script>
</body>
</html>
