<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التقييمات — منصة MADAR</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="css/evaluations.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="bg-orbs"></div>

  <main class="container">
    <header class="page-header">
      <h1>📝 التقييمات</h1>
      <p>اختر مجموعتك، واضغط على أي صورة لتكبيرها</p>
    </header>

    <div class="group-selector-wrapper">
      <label for="group-select">مجموعتي:</label>
      <select id="group-select">
        <option value="A">المجموعة A</option>
        <option value="B">المجموعة B</option>
        <option value="C">المجموعة C</option>
      </select>
    </div>

    <div id="state" class="loading-state"><div class="spinner"></div><span>جاري تحميل التقييمات...</span></div>
    <section id="evaluations-grid" class="evaluations-grid"></section>
  </main>

  <script type="module" src="js/evaluations.js"></script>
</body>
</html>
