<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معركة الزعيم — منصة MADAR</title>
  
  <link rel="stylesheet" href="base.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body { background-color: #0b0c10; overflow: hidden; }
    
    .navbar { background: rgba(11, 12, 16, 0.8); backdrop-filter: blur(12px); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); position: fixed; top: 0; width: 100%; z-index: 100; }
    .navbar .logo { font-size: 1.2rem; font-weight: 900; color: #fff; }
    
    .timer-box { display: flex; align-items: center; gap: 8px; background: rgba(239, 68, 68, 0.1); padding: 8px 16px; border-radius: var(--radius-sm); border: 1px solid #ef4444; font-weight: 900; font-size: 1.2rem; color: #ef4444; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    .loading-screen { position: fixed; inset: 0; background: var(--bg-color); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s; }
    .spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 🔥 تصميم ساحة المعركة */
    .battle-arena {
      max-width: 800px;
      margin: 90px auto 20px;
      padding: 0 20px;
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* الزعيم */
    .boss-container {
      text-align: center;
      margin-bottom: 30px;
      position: relative;
    }
    .boss-avatar {
      font-size: 5rem;
      animation: bossFloat 3s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(239, 68, 68, 0.6));
    }
    @keyframes bossFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    
    .boss-name { color: #ef4444; font-weight: 900; font-size: 1.2rem; margin-bottom: 10px; text-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }

    /* شريط صحة الزعيم */
    .boss-health-bar-container {
      width: 300px;
      height: 20px;
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid #ef4444;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      margin: 0 auto;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
    }
    .boss-health-fill {
      height: 100%;
      background: linear-gradient(90deg, #991b1b, #ef4444);
      width: 100%;
      transition: width 0.5s ease-out;
    }
    .boss-hp-text {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 0.7rem; font-weight: 900; text-shadow: 1px 1px 2px #000;
    }

    /* تأثير الاهتزاز عند الضرب */
    .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }

    /* أرقام الضرر الطايرة */
    .damage-number {
      position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
      font-size: 2rem; font-weight: 900; color: #ef4444;
      text-shadow: 0 0 10px #fff; pointer-events: none;
      animation: floatUp 1s forwards;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -100px) scale(1.5); }
    }

    /* كارت السؤال */
    .question-card { padding: 30px; margin-bottom: 20px; width: 100%; animation: fadeIn 0.4s ease-out; border: 1px solid var(--primary); box-shadow: 0 0 20px rgba(124, 58, 237, 0.2); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .question-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; }
    .question-number { color: var(--primary-light); font-weight: 700; font-size: 1.1rem; }
    .question-text { font-size: 1.3rem; font-weight: 700; line-height: 1.6; color: #fff; margin-bottom: 20px; }
    .question-image { max-width: 100%; border-radius: 10px; margin-bottom: 20px; display: none; }

    .options-list { display: flex; flex-direction: column; gap: 12px; }
    .option-item { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border); padding: 15px 20px; border-radius: var(--radius-sm); cursor: pointer; display: flex; align-items: center; gap: 15px; transition: var(--transition); font-size: 1.1rem; }
    .option-item:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(124, 58, 237, 0.6); transform: translateX(-5px); }
    .option-item.selected { background: rgba(124, 58, 237, 0.2); border-color: var(--primary); box-shadow: 0 0 15px rgba(124, 58, 237, 0.4); }
    
    .option-radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--text-muted); display: flex; align-items: center; justify-content: center; transition: var(--transition); flex-shrink: 0; }
    .option-item.selected .option-radio { border-color: #fff; background: var(--primary); }
    .option-item.selected .option-radio::after { content: '✓'; font-size: 12px; color: #fff; font-weight: bold; }

    .essay-area { display: none; width: 100%; min-height: 120px; padding: 15px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); color: #fff; font-family: inherit; font-size: 1.1rem; outline: none; resize: vertical; }
    .essay-area:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(124, 58, 237, 0.3); }

    .controls { display: flex; justify-content: space-between; gap: 15px; margin-top: 30px; }
    .btn { padding: 12px 25px; border-radius: var(--radius-sm); font-family: inherit; font-size: 1rem; font-weight: 900; cursor: pointer; transition: var(--transition); border: none; display: flex; align-items: center; gap: 8px; }
    .btn-prev { background: transparent; color: var(--text-muted); border: 1px solid var(--glass-border); }
    .btn-prev:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .btn-next { background: linear-gradient(135deg, #7c3aed, #22d3ee); color: #fff; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4); }
    .btn-next:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(124, 58, 237, 0.6); }
    .btn-submit { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; display: none; margin-right: auto; box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4); }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(34, 197, 94, 0.6); }

    .result-score { font-size: 4.5rem; font-weight: 900; color: var(--primary-light); text-align: center; margin: 20px 0; text-shadow: 0 0 20px rgba(124, 58, 237, 0.3); line-height: 1; }
    .result-text { text-align: center; font-size: 1.1rem; color: #fff; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="loading-screen" id="loading-screen">
    <div class="spinner"></div>
    <p style="margin-top: 20px; color: var(--text-muted); font-weight: 600;">جاري استدعاء الزعيم...</p>
  </div>

  <div class="bg-orbs"></div>

  <nav class="navbar">
    <div class="logo" id="nav-subject-name">معركة الزعيم</div>
    <div class="timer-box" id="timer-box" style="display:none;">
      <span id="timer-text">00:00</span>
    </div>
  </nav>

  <main class="battle-arena" id="exam-container" style="display:none;">
    
    <!-- 👹 الزعيم -->
    <div class="boss-container" id="boss-container">
      <div class="boss-avatar">👹</div>
      <div class="boss-name">حارس المعرفة</div>
      <div class="boss-health-bar-container">
        <div class="boss-health-fill" id="boss-health-fill"></div>
        <div class="boss-hp-text" id="boss-hp-text">100%</div>
      </div>
    </div>

    <!-- 📝 كارت السؤال -->
    <div class="question-card glass-panel" id="question-card">
      <div class="question-header"><span class="question-number" id="question-number">السؤال 1</span></div>
      <div class="question-text" id="question-text">جاري التحميل...</div>
      <img id="question-image" class="question-image" src="" alt="صورة السؤال">
      
      <div class="options-list" id="options-list"></div>
      <textarea id="essay-input" class="essay-area" placeholder="اكتب إجابتك هنا..."></textarea>

      <div class="controls">
        <button class="btn btn-prev" id="btn-prev" onclick="prevQuestion()" style="visibility: hidden;">السابق</button>
        <button class="btn btn-next" id="btn-next" onclick="nextQuestion()">التالي</button>
        <button class="btn btn-submit" id="btn-submit" onclick="confirmSubmit()">إنهاء المعركة!</button>
      </div>
    </div>
  </main>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
    import { doc, getDoc, collection, query, where, getDocs, addDoc, serverTimestamp, updateDoc } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

    let examData = null;
    let currentQuestionIndex = 0;
    let userAnswers = [];
    let timeLeft = 0;
    let timerInterval;
    let totalExamMarks = 0;
    let currentExamId = null;
    let currentSubjectName = null;
    let startTime = null; 
    let currentBossHP = 100;

    const qNumberEl = document.getElementById('question-number');
    const qTextEl = document.getElementById('question-text');
    const qImageEl = document.getElementById('question-image');
    const optionsListEl = document.getElementById('options-list');
    const essayInput = document.getElementById('essay-input');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnSubmit = document.getElementById('btn-submit');
    const timerText = document.getElementById('timer-text');
    const timerBox = document.getElementById('timer-box');
    const loadingScreen = document.getElementById('loading-screen');
    const examContainer = document.getElementById('exam-container');
    const bossContainer = document.getElementById('boss-container');
    const bossHealthFill = document.getElementById('boss-health-fill');
    const bossHpText = document.getElementById('boss-hp-text');

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "index.html"; return; }

      const urlParams = new URLSearchParams(window.location.search);
      currentExamId = urlParams.get('examId');
      currentSubjectName = urlParams.get('name') || 'اختبار عام';
      document.getElementById('nav-subject-name').textContent = `معركة: ${currentSubjectName}`;

      if (!currentExamId) {
        Swal.fire({ icon: 'error', title: 'خطأ', text: 'لم يتم العثور على الامتحان', background: '#12121f', color: '#fff' }).then(() => window.location.href = "dashboard.html");
        return;
      }

      try {
        const resultsQuery = query(collection(db, "results"), where("studentId", "==", user.uid), where("examId", "==", currentExamId));
        const resultsSnapshot = await getDocs(resultsQuery);

        if (!resultsSnapshot.empty) {
          Swal.fire({ icon: 'info', title: 'لقد قاتلت هذا الزعيم من قبل!', text: 'لا يمكنك إعادة الامتحان مرة أخرى.', background: '#12121f', color: '#fff' })
          .then(() => window.location.href = `subject.html?name=${encodeURIComponent(currentSubjectName)}`);
          return;
        }

        const docRef = doc(db, "exams", currentExamId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          examData = docSnap.data();
          if (!examData.questions || examData.questions.length === 0) throw new Error("الامتحان لا يحتوي على أسئلة");

          userAnswers = new Array(examData.questions.length).fill(null);
          totalExamMarks = examData.questions.reduce((sum, q) => sum + q.points, 0);
          timeLeft = examData.duration * 60;
          startTime = Date.now(); 
          
          // حساب الضرر لكل سؤال (عشان شريط صحة الزعيم)
          calculateDamagePerQuestion();

          loadingScreen.style.opacity = '0';
          setTimeout(() => {
            loadingScreen.style.display = 'none';
            examContainer.style.display = 'block';
            timerBox.style.display = 'flex';
          }, 500);

          renderQuestion();
          startTimer();
        } else {
          throw new Error("هذا الامتحان غير موجود");
        }
      } catch (error) {
        console.error(error);
        Swal.fire({ icon: 'error', title: 'عذراً', text: error.message, background: '#12121f', color: '#fff' })
        .then(() => window.location.href = `subject.html?name=${encodeURIComponent(currentSubjectName)}`);
      }
    });

    // حساب نسبة الضرر اللي السؤال بيعمله للزعيم
    let damagePerQuestion = [];
    function calculateDamagePerQuestion() {
        damagePerQuestion = examData.questions.map(q => (q.points / totalExamMarks) * 100);
    }

    function renderQuestion() {
      const q = examData.questions[currentQuestionIndex];
      qNumberEl.textContent = `السؤال ${currentQuestionIndex + 1} من ${examData.questions.length} (الدرجة: ${q.points})`;
      qTextEl.textContent = q.text;
      
      if (q.imageUrl) {
          qImageEl.src = q.imageUrl;
          qImageEl.style.display = 'block';
      } else {
          qImageEl.style.display = 'none';
      }

      if (q.type === 'essay') {
          optionsListEl.style.display = 'none';
          essayInput.style.display = 'block';
          essayInput.value = userAnswers[currentQuestionIndex] || "";
          essayInput.oninput = () => { userAnswers[currentQuestionIndex] = essayInput.value; };
      } else {
          optionsListEl.style.display = 'flex';
          essayInput.style.display = 'none';
          
          optionsListEl.innerHTML = '';
          q.options.forEach((opt, index) => {
            const div = document.createElement('div');
            div.className = `option-item ${userAnswers[currentQuestionIndex] === index ? 'selected' : ''}`;
            div.innerHTML = `<div class="option-radio"></div><span>${opt}</span>`;
            div.onclick = () => selectOption(index, q.correct, q.points);
            optionsListEl.appendChild(div);
          });
      }

      btnPrev.style.visibility = currentQuestionIndex === 0 ? 'hidden' : 'visible';
      if (currentQuestionIndex === examData.questions.length - 1) {
        btnNext.style.display = 'none';
        btnSubmit.style.display = 'block';
      } else {
        btnNext.style.display = 'block';
        btnSubmit.style.display = 'none';
      }
    }

    // 🔥 السحر هنا: لما الطالب يجاوب صح، الزعيم بيتضرب
    window.selectOption = (index, correctIndex, points) => {
        userAnswers[currentQuestionIndex] = index; 
        
        // هنرسم الاختيار
        const options = document.querySelectorAll('.option-item');
        options.forEach((opt, i) => {
            if (i === index) opt.classList.add('selected');
            else opt.classList.remove('selected');
        });

        // لو الإجابة صح، هنعمل ضربة للزعيم
        if (index === correctIndex) {
            attackBoss(currentQuestionIndex, points);
        }
    };

    function attackBoss(qIndex, points) {
        // لو الزعيم اتضرب خلاص في السؤال ده، منضربوش تاني
        if (bossHealthFill.style.width !== "" && parseFloat(bossHealthFill.style.width) < 0) return;

        // حساب الضرر
        let damage = damagePerQuestion[qIndex];
        
        // نخصم من صحة الزعيم
        currentBossHP -= damage;
        if (currentBossHP < 0) currentBossHP = 0;

        // تحديث الشريط
        bossHealthFill.style.width = `${currentBossHP}%`;
        bossHpText.textContent = `${Math.round(currentBossHP)}%`;

        // تأثير اهتزاز الزعيم
        bossContainer.classList.add('shake');
        setTimeout(() => bossContainer.classList.remove('shake'), 500);

        // ظهور رقم الضرر
        const damageEl = document.createElement('div');
        damageEl.className = 'damage-number';
        damageEl.textContent = `-${Math.round(damage)} HP`;
        bossContainer.appendChild(damageEl);
        setTimeout(() => damageEl.remove(), 1000);
    }

    window.nextQuestion = () => { if (currentQuestionIndex < examData.questions.length - 1) { currentQuestionIndex++; renderQuestion(); } };
    window.prevQuestion = () => { if (currentQuestionIndex > 0) { currentQuestionIndex--; renderQuestion(); } };

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerText.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

        if (timeLeft <= 60) timerBox.className = 'timer-box danger';
        if (timeLeft <= 0) { clearInterval(timerInterval); autoSubmit(); }
      }, 1000);
    }

    window.confirmSubmit = () => {
      const unanswered = userAnswers.filter(ans => ans === null || ans === "").length;
      let textMsg = "هل أنت متأكد من إنهاء المعركة وتسليم إجاباتك؟";
      if (unanswered > 0) textMsg = `لديك ${unanswered} أسئلة لم تجب عليها. هل تريد التسليم؟`;

      Swal.fire({
        title: 'تأكيد التسليم', text: textMsg, icon: 'warning',
        showCancelButton: true, confirmButtonColor: '#22c55e', cancelButtonColor: '#ef4444',
        confirmButtonText: 'نعم، سلم المعركة', cancelButtonText: 'لا، أكمل القتال', background: '#12121f', color: '#fff'
      }).then((result) => { if (result.isConfirmed) finishExam(); });
    };

    function autoSubmit() {
      Swal.fire({
        title: 'انتهى الوقت!', text: 'تم تسليم إجاباتك تلقائياً.', icon: 'info',
        confirmButtonColor: '#7c3aed', confirmButtonText: 'عرض النتيجة', background: '#12121f', color: '#fff', allowOutsideClick: false
      }).then(() => finishExam());
    }

    async function finishExam() {
      clearInterval(timerInterval);
      btnSubmit.disabled = true;
      btnSubmit.textContent = "جاري حساب النتيجة...";

      const timeTaken = Math.floor((Date.now() - startTime) / 1000);

      let studentScore = 0;
      const studentAnswersDetails = [];

      examData.questions.forEach((q, index) => {
        let isCorrect = false;
        let pointsEarned = 0;
        let studentAnsText = userAnswers[index];

        if (q.type === 'mcq') {
            isCorrect = userAnswers[index] === q.correct;
            pointsEarned = isCorrect ? q.points : 0;
            studentAnsText = userAnswers[index] !== null ? q.options[userAnswers[index]] : "لم يجب على السؤال";
        } else {
            pointsEarned = 0; 
            if (!studentAnsText) studentAnsText = "لم يجب على السؤال";
        }

        if (isCorrect) studentScore += q.points;

        const correctAnsText = q.type === 'mcq' ? q.options[q.correct] : "تصحيح بالذكاء الاصطناعي";

        studentAnswersDetails.push({
          questionText: q.text,
          studentAnswer: studentAnsText,
          correctAnswer: correctAnsText,
          pointsEarned: pointsEarned,
          maxPoints: q.points,
          type: q.type
        });
      });

      const percentage = Math.round((studentScore / totalExamMarks) * 100);
      
      try {
        const userDocRef = doc(db, "users", auth.currentUser.uid);
        const userDocSnap = await getDoc(userDocRef);
        const studentGrade = userDocSnap.exists() ? userDocSnap.data().gradeLevel : "unknown";

        await addDoc(collection(db, "results"), {
          studentId: auth.currentUser.uid,
          studentName: auth.currentUser.displayName || "طالب",
          studentGrade: studentGrade, 
          examId: currentExamId,
          examTitle: examData.title,
          subject: currentSubjectName,
          score: studentScore,
          totalMarks: totalExamMarks,
          percentage: percentage,
          timeTaken: timeTaken,
          submittedAt: serverTimestamp(),
          studentAnswers: studentAnswersDetails
        });

        const currentXP = userDocSnap.data().xp || 0;
        const currentLevel = userDocSnap.data().level || 1;
        const earnedXP = studentScore * 10; 
        const newXP = currentXP + earnedXP;
        const newLevel = Math.floor(newXP / 100) + 1;
        const leveledUp = newLevel > currentLevel;

        await updateDoc(userDocRef, { xp: newXP, level: newLevel });

        // 🏆 إعلان النصر أو الهزيمة
        let resultColor = percentage >= 50 ? '#22c55e' : '#ef4444';
        let resultMsg = percentage >= 50 ? '🎉 لقد هزمت الزعيم بنجاح! 🎉' : '💀 لقد هُزمت.. تحتاج لمزيد من التدريب.';
        
        let xpHTML = `<div style="margin-top: 15px; color: #f59e0b; font-weight: bold; font-size: 1.1rem;">+${earnedXP} XP 🌟</div>`;
        if (leveledUp) {
            xpHTML += `<div style="margin-top: 5px; color: #a78bfa; font-weight: 900; font-size: 1.3rem; animation: pulse 1s infinite;">🎉 مبروك! لقد وصلت للمستوى ${newLevel} 🎉</div>`;
        }

        Swal.fire({
          title: percentage >= 50 ? 'انتصار!' : 'هزيمة!',
          html: `
            <div class="result-score" style="color: ${resultColor}">${studentScore} / ${totalExamMarks}</div>
            <div class="result-text" style="color: ${resultColor}; font-weight:bold; font-size:1.2rem;">${resultMsg}</div>
            ${xpHTML}
          `,
          imageUrl: percentage >= 50 ? 'https://cdn-icons-png.flaticon.com/512/3112/3112946.png' : 'https://cdn-icons-png.flaticon.com/512/564/564619.png',
          imageWidth: 100, imageHeight: 100, imageAlt: 'Result',
          confirmButtonColor: '#7c3aed', confirmButtonText: 'العودة للمواد', background: '#12121f', color: '#fff', allowOutsideClick: false
        }).then(() => { window.location.href = `subject.html?name=${encodeURIComponent(currentSubjectName)}`; });

      } catch (error) {
        console.error("Error saving result:", error);
        Swal.fire({ icon: 'error', title: 'خطأ', text: 'حدث خطأ أثناء حفظ النتيجة. تواصل مع المعلم.', background: '#12121f', color: '#fff' });
        btnSubmit.disabled = false; btnSubmit.textContent = "إنهاء وتسليم الاختبار";
      }
    }
  </script>
</body>
</html>
