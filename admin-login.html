<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دخول المعلمين — منصة MADAR</title>
  <link rel="stylesheet" href="base.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card { width: 100%; max-width: 420px; padding: 40px 30px; text-align: center; background: var(--surface-color); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: var(--radius); }
    .auth-card h2 { color: #fff; margin-bottom: 5px; }
    .auth-card p { color: var(--text-muted); margin-bottom: 30px; font-size: 0.9rem; }
    .input-group { margin-bottom: 15px; text-align: right; }
    .input-group label { display: block; color: var(--text-muted); margin-bottom: 8px; font-size: 0.9rem; }
    .input-group input { width: 100%; padding: 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); color: #fff; outline: none; }
    .input-group input:focus { border-color: var(--primary); }
    .btn-submit { width: 100%; padding: 15px; background: linear-gradient(135deg, #7c3aed, #22d3ee); color: #fff; border: none; border-radius: var(--radius-sm); font-weight: 700; cursor: pointer; margin-top: 10px; }
    .back-link { display: block; margin-top: 20px; color: var(--text-muted); font-size: 0.9rem; text-decoration: none; }
    .back-link:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="bg-orbs"></div>
  <main class="auth-wrap">
    <div class="auth-card">
      <span style="font-size: 3rem;">👨‍🏫</span>
      <h2>بوابة المعلمين</h2>
      <p>مخصصة للأدمن والمدرسين فقط</p>
      <form id="admin-login-form">
        <div class="input-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="admin-email" required placeholder="admin@example.com">
        </div>
        <div class="input-group">
          <label>كلمة المرور</label>
          <input type="password" id="admin-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-submit" id="admin-btn">دخول لوحة التحكم</button>
      </form>
      <a href="index.html" class="back-link">← العودة لدخول الطلاب</a>
    </div>
  </main>

  <script type="module">
    import { auth } from "./firebase.js";
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('admin-email').value;
      const password = document.getElementById('admin-password').value;
      const btn = document.getElementById('admin-btn');
      
      btn.disabled = true; btn.textContent = "جاري التحقق...";

      try {
        await signInWithEmailAndPassword(auth, email, password);
        // لو نجح، يروح على طول لوحة التحكم
        window.location.href = "admin/admin.html";
      } catch (error) {
        Swal.fire({ icon: 'error', title: 'خطأ', text: 'بيانات الدخول غير صحيحة', background: '#12121f', color: '#fff' });
        btn.disabled = false; btn.textContent = "دخول لوحة التحكم";
      }
    });
  </script>
</body>
</html>
