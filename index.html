<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دخول الطلاب — منصة MADAR</title>
  <link rel="stylesheet" href="base.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .split-screen { display: flex; min-height: 100vh; }
    .brand-section { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; }
    .brand-logo { width: 100%; max-width: 400px; border-radius: 20px; box-shadow: 0 0 30px rgba(124, 58, 237, 0.3); }
    .form-section { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; }
    .auth-card { width: 100%; max-width: 400px; padding: 40px 30px; background: var(--surface-color); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: var(--radius); text-align: center; }
    .auth-card h2 { color: #fff; margin-bottom: 20px; }
    .input-group { text-align: right; margin-bottom: 15px; }
    .input-group label { display: block; color: var(--text-muted); margin-bottom: 5px; font-size: 0.9rem; }
    .input-group input { width: 100%; padding: 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); color: #fff; outline: none; }
    .input-group input:focus { border-color: var(--primary); }
    .btn-submit { width: 100%; padding: 15px; background: linear-gradient(135deg, #7c3aed, #22d3ee); color: #fff; border: none; border-radius: var(--radius-sm); font-weight: 700; cursor: pointer; margin-top: 10px; }
    .auth-footer { margin-top: 20px; font-size: 0.9rem; color: var(--text-muted); }
    .auth-footer a { color: var(--accent); font-weight: 700; }
    .admin-link { display: block; margin-top: 30px; font-size: 0.8rem; color: #555; text-decoration: none; }
    .admin-link:hover { color: var(--primary-light); }
    
    /* 🔥 التعديل هنا: إظهار اللوجو في الموبايل */
    @media (max-width: 900px) { 
      .split-screen { flex-direction: column; } 
      .brand-section { padding: 30px 20px 10px 20px; } 
      .brand-logo { max-width: 200px; }
      .form-section { padding: 10px 20px 30px 20px; }
    }
  </style>
</head>
<body>
  <div class="bg-orbs"></div>
  <main class="split-screen">
    <div class="brand-section">
      <img src="logo.jpg" alt="MADAR" class="brand-logo">
    </div>
    <div class="form-section">
      <div class="auth-card">
        <h2>تسجيل دخول الطلاب</h2>
        <form id="login-form">
          <div class="input-group">
            <label>البريد الإلكتروني</label>
            <input type="email" id="email" required placeholder="you@example.com">
          </div>
          <div class="input-group">
            <label>كلمة المرور</label>
            <input type="password" id="password" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn-submit" id="login-btn">دخول</button>
        </form>
        <div class="auth-footer">مش عندك حساب؟ <a href="register.html">سجل دلوقتي</a></div>
        <a href="admin-login.html" class="admin-link">دخول المعلمين</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { auth } from "./firebase.js";
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      
      btn.disabled = true; btn.textContent = "جاري الدخول...";

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const studentName = userCredential.user.displayName || "طالب";
        
        Swal.fire({ 
            icon: 'success', 
            title: `أهلاً بك يا ${studentName} في منصة مدار!`, 
            timer: 2000, 
            showConfirmButton: false, 
            background: '#12121f', color: '#fff' 
        }).then(() => { window.location.href = "dashboard.html"; });

      } catch (error) {
        Swal.fire({ icon: 'error', title: 'عفواً', text: 'إيميل أو كلمة مرور غير صحيحة', background: '#12121f', color: '#fff' });
        btn.disabled = false; btn.textContent = "دخول";
      }
    });
  </script>
</body>
</html>
